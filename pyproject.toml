[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-toolkit"
version = "0.1.0"
description = "A dependency-light (numpy-only) statevector simulator and canonical quantum algorithms (Deutsch-Jozsa, Grover, QFT, Bernstein-Vazirani)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DarviQ Systems" }]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
qiskit = [
    "qiskit>=1.0",
]

[project.scripts]
quantum-toolkit = "quantum_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
